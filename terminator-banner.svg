<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Terminator-style HUD banner: Ruieneanu Dorian" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ruieneanu Dorian</title>
  <defs>
    <radialGradient id="bgGlow" cx="17%" cy="50%" r="75%">
      <stop offset="0" stop-color="#3b0502"/>
      <stop offset="0.55" stop-color="#120201"/>
      <stop offset="1" stop-color="#050000"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4ee"/>
      <stop offset="0.18" stop-color="#ff8a70"/>
      <stop offset="0.5" stop-color="#ff2a1a"/>
      <stop offset="1" stop-color="#5a0600" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a44" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="c1"><rect x="340" y="176" width="0" height="26"><animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="340" y="204" width="0" height="26"><animate attributeName="width" from="0" to="420" dur="0.9s" begin="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="340" y="232" width="0" height="26"><animate attributeName="width" from="0" to="420" dur="1.1s" begin="2.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="tick"><rect x="0" y="288" width="1000" height="32"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="1000" height="320" fill="url(#bgGlow)"/>
  <rect width="1000" height="320" fill="url(#scan)"/>

  <!-- faint grid -->
  <g stroke="#ff2a1a" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000M0 280H1000"/>
    <path d="M100 0V320M200 0V320M300 0V320M400 0V320M500 0V320M600 0V320M700 0V320M800 0V320M900 0V320"/>
  </g>

  <!-- ===== EYE ===== -->
  <g transform="translate(170 150)">
    <circle r="62" fill="#ff2a1a" opacity="0.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle r="112" fill="none" stroke="#ff2a1a" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="92" fill="none" stroke="#ff2a1a" stroke-width="3" stroke-dasharray="40 18 6 18" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </g>
    <circle r="70" fill="none" stroke="#ff2a1a" stroke-width="1" opacity="0.55"/>

    <circle r="46" fill="url(#eye)" filter="url(#glow)">
      <animate attributeName="r" values="44;48;44" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#fff4ee">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- crosshair -->
    <g stroke="#ff2a1a" stroke-width="1.5" opacity="0.9">
      <path d="M-128 0H-58M58 0H128M0 -128V-58M0 58V128"/>
    </g>
    <g stroke="#ff2a1a" stroke-width="1" opacity="0.6">
      <path d="M-112 -6V6M112 -6V6M-6 -112H6M-6 112H6"/>
    </g>
  </g>

  <!-- ===== HUD TEXT: TOP ===== -->
  <g font-family="'Courier New', Courier, ui-monospace, monospace" fill="#ff2a1a">
    <text x="340" y="52" font-size="12" opacity="0.85">CYBERDYNE SYSTEMS  //  MODEL 101  //  VISION 2.9</text>
    <text x="960" y="52" font-size="12" text-anchor="end" opacity="0.85">SCAN
      <tspan>
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
        ACTIVE
      </tspan>
    </text>
    <path d="M340 62H960" stroke="#ff2a1a" stroke-opacity="0.5"/>

    <!-- ===== NAME ===== -->
    <g filter="url(#glow)" font-weight="700">
      <text x="338" y="124" font-size="66" letter-spacing="2" fill="#ff2a1a">RUIENEANU</text>
      <text x="338" y="170" font-size="40" letter-spacing="14" fill="#ff6a55">DORIAN</text>
    </g>
  </g>

  <!-- target-lock brackets around name -->
  <g fill="none" stroke="#ff2a1a" stroke-width="2.5">
    <path d="M322 74V86M322 74H334"/>
    <path d="M706 74H718M718 74V86"/>
    <path d="M322 178V166M322 178H334"/>
    <path d="M706 178H718M718 178V166"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <text x="730" y="112" font-family="'Courier New', Courier, ui-monospace, monospace" font-size="12" fill="#ff2a1a" opacity="0.85">TARGET</text>
  <text x="730" y="128" font-family="'Courier New', Courier, ui-monospace, monospace" font-size="12" fill="#ff2a1a" opacity="0.85">LOCKED</text>

  <!-- ===== READOUT (typed in) ===== -->
  <g font-family="'Courier New', Courier, ui-monospace, monospace" font-size="16" fill="#ff5a44">
    <g clip-path="url(#c1)"><text x="340" y="195">&gt; SUBJECT IDENTIFIED. CLASS: DEVELOPER</text></g>
    <g clip-path="url(#c2)"><text x="340" y="223">&gt; MISSION: BUILD. SHIP. REPEAT.</text></g>
    <g clip-path="url(#c3)"><text x="340" y="251" fill="#ffb3a6">&gt; I'LL BE BACK... WITH A PULL REQUEST.<tspan fill="#ff2a1a">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>_</tspan></text></g>
  </g>

  <!-- ===== LEFT HUD READOUTS ===== -->
  <g font-family="'Courier New', Courier, ui-monospace, monospace" font-size="11" fill="#ff2a1a" opacity="0.8">
    <text x="30" y="40">TEMP 36.6C</text>
    <text x="30" y="56">THREAT 0.00%</text>
    <text x="30" y="276">RANGE 001.2M</text>
    <text x="30" y="260">AIM 100%</text>
  </g>

  <!-- ===== SCAN BEAM ===== -->
  <rect x="0" y="-12" width="1000" height="12" fill="url(#beam)">
    <animate attributeName="y" values="-12;320" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== BOTTOM TICKER ===== -->
  <rect x="0" y="288" width="1000" height="32" fill="#1a0201"/>
  <path d="M0 288H1000" stroke="#ff2a1a" stroke-width="1.5"/>
  <g clip-path="url(#tick)">
    <g font-family="'Courier New', Courier, ui-monospace, monospace" font-size="12" fill="#ff2a1a" opacity="0.85">
      <text y="308" xml:space="preserve">01010010 01010101 01001001 01000101 01001110 01000101 01000001 01001110 01010101  //  git commit -m "judgment day"  //  01000100 01001111 01010010 01001001 01000001 01001110  //  git push origin main --force-with-lease  //  01010010 01010101 01001001 01000101 01001110 01000101 01000001 01001110 01010101  //  git commit -m "judgment day"  //  01000100 01001111 01010010 01001001 01000001 01001110  //  git push origin main --force-with-lease</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1450 0" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== FRAME CORNERS ===== -->
  <g fill="none" stroke="#ff2a1a" stroke-width="3">
    <path d="M8 30V8H30"/>
    <path d="M970 8H992V30"/>
    <path d="M8 262V284"/>
    <path d="M992 262V284"/>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</svg>
